<style>/* VOICE: a pro brokerage app at night — dense, exact, calm.
   IDEA: the broker's "Markets" screen: index lines racing on black, grouped lists with chevrons.
   PICTURE: the multi-line Indices chart with timeframe switch, and touchable price charts.
   COLOUR and TYPE: near-black ground, graphite cards, electric blue accent; Inter with tabular figures.
   LAYOUT: two columns on desktop (account left, markets right); one column with a bottom tab bar on phones. */
:root{color-scheme:dark;--bg:#000000;--p:#1c1c1e;--p2:#2c2c2e;--ln:#2c2c2e;--ink:#ffffff;--mut:#8e8e93;--b:#ffffff;--b2:#ffffff;--up:#30d158;--dn:#ff453a;--grid:#2c2c2e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:800}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:700}
a{color:var(--b2)}
.num,.r,td.r{font-variant-numeric:tabular-nums;white-space:nowrap}.r{text-align:right}
.mut{color:var(--mut)}.up{color:var(--up)}.dn{color:var(--dn)}
.banner{font-size:12px;color:var(--mut);text-align:center;padding:6px 14px;background:#020305;border-bottom:1px solid var(--ln)}
header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;padding:10px max(3vw,16px);background:rgba(0,0,0,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
nav{display:flex;gap:2px;flex:1;justify-content:center}
nav a{display:flex;gap:7px;align-items:center;color:var(--mut);text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px}
nav a:hover{color:var(--ink)}nav a.on{color:var(--b2);background:#2c2c2e}
nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{font-size:13.5px;padding:7px 12px;border:1px solid var(--ln);border-radius:999px;background:var(--p);white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:22px max(3vw,16px) 70px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.stackc{display:grid;gap:16px}
.g2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.pad{padding:18px}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 6px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--mut);font-weight:500}
.big{font-size:clamp(32px,5vw,46px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:0;background:var(--p);border-top:1px solid var(--ln)}
.stats>div{background:var(--p);padding:12px 18px;box-shadow:inset -1px -1px 0 var(--ln)}.stats b{display:block;font-size:16.5px;font-variant-numeric:tabular-nums}.stats span{font-size:12.5px;color:var(--mut)}
.fig{position:relative;min-height:230px;margin:6px 8px 0;touch-action:pan-y}.fig>svg{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;cursor:crosshair}
.fig.tall{min-height:300px}.fig.sm{min-height:170px}
.ax{fill:#8e8e93;font-size:11px;font-family:Inter}
.tip{position:absolute;top:0;display:none;pointer-events:none;background:#1c1c1eee;border:1px solid var(--ln);border-radius:10px;padding:7px 10px;font-size:12.5px;z-index:2;white-space:nowrap}
.tip .tt{color:var(--mut);margin-bottom:2px}.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:#000000;border:1px solid var(--ln);border-radius:10px;padding:3px;margin:10px 14px 4px}
.seg button{white-space:nowrap;padding:0 4px;min-height:34px;border:0;background:none;color:var(--ink);font:500 13.5px Inter;border-radius:8px;cursor:pointer}
.seg button.on{background:#3a3a3c;font-weight:600}
.list{border-top:1px solid var(--ln)}
.li{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #2c2c2e;cursor:pointer;text-decoration:none;color:inherit;min-height:56px}
.li:last-child{border-bottom:0}.li:hover{background:#242426}
.li .grow{flex:1;display:grid;line-height:1.3}.li .grow small{color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .rt{text-align:right;display:grid;line-height:1.3;font-variant-numeric:tabular-nums}.li .rt small{font-size:12.5px}
.chev{width:8px;height:8px;border-right:2px solid #5a5a5f;border-top:2px solid #5a5a5f;transform:rotate(45deg);flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tk{display:inline-grid;place-items:center;min-width:52px;font-weight:800;font-size:12.5px;background:#2c2c2e;color:var(--b2);padding:5px 7px;border-radius:7px;flex:none}
.spark{width:72px;height:26px;flex:none}
.cbox{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 7px;border-radius:6px;min-width:66px;text-align:right}
.cbox.up{background:#0f2a17}.cbox.dn{background:#3a1412}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:#0d0d0f;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
label{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:500}
.form{display:grid;gap:13px}.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
button,.btn{font:600 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--ln);background:var(--p2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.pri{background:var(--b);border-color:var(--b)}.pri:hover{background:#e5e5ea}
.sell{background:#ff453a;border-color:#ff453a}.ok{background:#30d158;border-color:#30d158}
button:disabled{opacity:.45;cursor:not-allowed}
.sm-b{min-height:34px;font-size:13px;padding:0 11px;border-radius:9px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0d0d0f;border:1px solid var(--ln);padding:4px;border-radius:12px}
.bs button{border:0;background:none;min-height:40px}.bs button.on.b{background:#ffffff;color:#000000}.bs button.on.s{background:#ff453a;color:#ffffff}
.qq{display:flex;gap:6px;flex-wrap:wrap}
.est{background:#0d0d0f;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.est div{display:flex;justify-content:space-between;gap:10px}.est b{font-variant-numeric:tabular-nums}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}.msg.okm{background:#0d2a1c;color:#b9f0d2}.msg.err{background:#3a0f16;color:#ffc6cc}.msg:empty{display:none}
.note{font-size:13px;color:var(--mut)}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--ln);color:var(--mut);font-weight:600;white-space:nowrap}
.pill.bl{border-color:#ffffff55;color:var(--b2)}.pill.gr{border-color:#30d15855;color:var(--up)}.pill.rd{border-color:#ff453a55;color:var(--dn)}
.bar{height:8px;border-radius:99px;background:#3a3a3c;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),#ffffff);border-radius:99px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips button{flex:none;min-height:34px;font-size:13px;padding:0 12px;border-radius:99px;background:var(--p)}.chips button.on{background:#ffffff;border-color:var(--b);color:#000000}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--mut);font-size:12.5px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--ln)}
td{padding:10px 12px;border-bottom:1px solid #2a2a2d}
.scroll{overflow-x:auto}
.k-BUY,.k-FILL{color:var(--up)}.k-SELL,.k-REP-SALE{color:var(--dn)}.k-IPO,.k-IPO-SUB,.k-LIST{color:#d1d1d6}.k-ORDER,.k-REP-REQ{color:var(--b2)}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:22px 18px;color:var(--mut)}
.calc{display:grid;gap:8px;font-size:14.5px}.calc div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed #38383a}.calc b{font-variant-numeric:tabular-nums}
.formula{font-size:15px;background:#0d0d0f;border:1px solid var(--ln);border-radius:12px;padding:14px;line-height:1.7;overflow-x:auto}
.star{background:none;border:1px solid var(--ln);width:44px;padding:0;font-size:20px;color:#ffc94d}
.hide{display:none!important}
@media(max-width:900px){.cols,.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){

}
